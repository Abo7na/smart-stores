<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المتاجر الذكية</title>
  <style>
    :root { --primary: #d97706; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 115px; }
    header { background: var(--primary); color: #fff; padding: 18px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    header h1 { margin: 0; font-size: 1.15rem; }
    .btn { border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-light { background: rgba(255,255,255,.2); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-dark { background: #1e293b; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 0.8rem; }
    .container { max-width: 720px; margin: 16px auto; padding: 0 14px; }
    .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 600; }
    .alert-warn { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    .alert-err { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    .store-meta { background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.88rem; color: var(--muted); border: 1px solid #e2e8f0; }
    .offers-box { margin-bottom: 14px; }
    .offer-card { background: linear-gradient(135deg, #fffbeb, #ffffff); border: 1px dashed var(--primary); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
    .offer-title { font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .offer-desc { font-size: 0.86rem; color: var(--text); }
    .offer-price { font-weight: 700; margin-top: 4px; font-size: 0.9rem; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .cat-btn { background: var(--card); border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 14px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .item-card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid #e2e8f0; flex-shrink: 0; }
    .item-title { font-weight: 700; margin-bottom: 4px; }
    .item-desc { color: var(--muted); font-size: 0.84rem; margin-bottom: 6px; }
    .item-price { font-weight: 700; color: var(--primary); }
    .qty-box { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-weight: bold; cursor: pointer; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 30; box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
    .panel { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 16px; border: 1px solid #e2e8f0; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 6px; margin-bottom: 10px; background: #fff; }
    input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }
    .badge-off { background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; }
    .sec-title { margin: 16px 0 8px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
  </style>
</head>
<body>
  <header>
    <h1 id="storeName">جاري التحميل...</h1>
    <button class="btn btn-light" onclick="toggleAdmin()">إدارة المحل</button>
  </header>

  <div class="container">
    <div id="subBanner"></div>
    <div id="storeContent">
      <div id="storeMeta" class="store-meta" style="display:none;"></div>
      <div id="offersBox" class="offers-box" style="display:none;"></div>
      <div class="cats" id="catsBar"></div>
      <div id="itemsList"></div>
    </div>

    <div id="adminPanel" class="panel" style="display:none;">
      <h3>لوحة إدارة المحل</h3>
      <div id="adminLogin">
        <label>رمز PIN الخاص بالمحل:</label>
        <input type="password" id="pinInput" placeholder="أدخل رمز PIN" />
        <label>رمز GitHub Token (يُحفظ في جهازك فقط للتحديث):</label>
        <input type="password" id="ghTokenInput" placeholder="ghp_..." />
        <button class="btn btn-dark" onclick="unlockAdmin()">دخول</button>
      </div>
      <div id="adminEditor" style="display:none;"></div>
    </div>
  </div>

  <div class="cart-bar" id="cartBar" style="display:none;">
    <div>
      <div>الإجمالي: <strong id="cartTotal">0</strong> <span id="currLabel"></span></div>
      <small id="cartCount" style="color:var(--muted)">0 أصناف</small>
    </div>
    <button class="btn btn-primary" onclick="sendOrder()">إرسال الطلب</button>
  </div>

  <script>
    const GIST_ID = "29a880a7f2a8e52e7ca8192168eae9e9";
    const API_URL = `https://api.github.com/gists/${GIST_ID}`;
    const params = new URLSearchParams(location.search);
    const storeId = params.get("store") || "bakery1";

    let dbData = null;
    let store = null;
    let activeCat = "الكل";
    let cart = {};
    let isSuspended = false;

    async function init() {
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const gist = await res.json();
        const fileObj = gist.files["stores.json"] || Object.values(gist.files)[0];
        if (!fileObj || !fileObj.content) throw new Error("ملف stores.json فارغ أو غير موجود");
        dbData = JSON.parse(fileObj.content);
        store = dbData.stores[storeId];
        if (!store) {
          document.getElementById("storeName").textContent = "المتجر غير موجود";
          document.getElementById("storeContent").innerHTML = `<div class="alert alert-err">لم يتم العثور على المتجر: ${storeId}</div>`;
          return;
        }
        applyTheme();
        renderMeta();
        renderOffers();
        checkSubscription();
        renderMenu();
      } catch (e) {
        document.getElementById("storeName").textContent = "تعذر التحميل";
        document.getElementById("storeContent").innerHTML = `<div class="alert alert-err">سبب المشكلة: ${e.message}</div>`;
      }
    }

    function applyTheme() {
      document.title = store.info.name;
      document.getElementById("storeName").textContent = store.info.name;
      document.documentElement.style.setProperty("--primary", store.info.theme_color || "#d97706");
      document.getElementById("currLabel").textContent = store.info.currency || "";
    }

    function renderMeta() {
      const metaEl = document.getElementById("storeMeta");
      const loc = store.info.location_text || "";
      const phone = store.info.phone_whatsapp || "";
      const fee = Number(store.info.delivery_fee || 0);
      let parts = [];
      if (loc) parts.push(`📍 الموقع: ${loc}`);
      if (phone) parts.push(`📞 واتساب: ${phone}`);
      if (fee > 0) parts.push(`🚚 التوصيل: ${fee.toLocaleString()} ${store.info.currency || ""}`);
      if (parts.length > 0) {
        metaEl.style.display = "block";
        metaEl.innerHTML = parts.join(" &nbsp;|&nbsp; ");
      } else {
        metaEl.style.display = "none";
      }
    }

    function renderOffers() {
      const box = document.getElementById("offersBox");
      const offers = store.offers || [];
      if (!offers.length) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      box.innerHTML = offers.map(o => `
        <div class="offer-card">
          <div class="offer-title">🔥 عرض خاص: ${o.title}</div>
          <div class="offer-desc">${o.desc || ""}</div>
          ${o.price ? `<div class="offer-price">سعر العرض: ${Number(o.price).toLocaleString()} ${store.info.currency || ""}</div>` : ""}
        </div>
      `).join("");
    }

    function checkSubscription() {
      const sub = store.subscription || {};
      const warnDays = (dbData.platform_settings && dbData.platform_settings.warning_days) || 3;
      const graceDays = sub.grace_days ?? ((dbData.platform_settings && dbData.platform_settings.default_grace_days) || 3);
      if (!sub.expiry_date) return;

      const today = new Date();
      today.setHours(0,0,0,0);
      const exp = new Date(sub.expiry_date + "T00:00:00");
      const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
      const banner = document.getElementById("subBanner");

      if (diffDays < -graceDays || sub.status === "suspended") {
        isSuspended = true;
        banner.innerHTML = `<div class="alert alert-err">تم إيقاف صفحة المتجر مؤقتاً لانتهاء فترة الاشتراك والسماح. يرجى التواصل لتجديد الاشتراك.</div>`;
        document.getElementById("storeContent").style.display = "none";
        document.getElementById("cartBar").style.display = "none";
      } else if (diffDays <= 0) {
        banner.innerHTML = `<div class="alert alert-warn">انتهى تاريخ الاشتراك! لديك مهلة سماح (${graceDays} أيام) قبل الإيقاف التلقائي.</div>`;
      } else if (diffDays <= warnDays) {
        banner.innerHTML = `<div class="alert alert-warn">تنبيه: ينتهي اشتراك المتجر خلال ${diffDays} يوم (${sub.expiry_date}).</div>`;
      }
    }

    function renderMenu() {
      if (isSuspended) return;
      const cats = ["الكل", ...(store.categories || [])];
      const catsBar = document.getElementById("catsBar");
      catsBar.innerHTML = cats.map(c => `<button class="cat-btn ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");

      const filtered = (store.items || []).filter(i => activeCat === "الكل" || i.category === activeCat);
      document.getElementById("itemsList").innerHTML = filtered.map(item => {
        const q = cart[item.id] || 0;
        const imgTag = item.image ? `<img src="${item.image}" alt="${item.name}" class="item-img" onerror="this.style.display='none'" />` : "";
        return `
          <div class="item-card">
            <div class="item-left">
              ${imgTag}
              <div>
                <div class="item-title">${item.name} ${!item.available ? '<span class="badge-off">نفد</span>' : ''}</div>
                <div class="item-desc">${item.desc || ""}</div>
                <div class="item-price">${Number(item.price).toLocaleString()} ${store.info.currency || ""}</div>
              </div>
            </div>
            <div class="qty-box">
              ${item.available ? `
                <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                <span>${q}</span>
                <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
              ` : `<small style="color:var(--muted)">غير متوفر</small>`}
            </div>
          </div>
        `;
      }).join("");
      updateCart();
    }

    function setCat(c) { activeCat = c; renderMenu(); }

    function changeQty(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) delete cart[id];
      else cart[id] = next;
      renderMenu();
    }

    function updateCart() {
      if (isSuspended) return;
      let count = 0, subtotal = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = (store.items || []).find(x => x.id === id);
        if (item) { count += qty; subtotal += item.price * qty; }
      }
      const bar = document.getElementById("cartBar");
      if (count === 0) { bar.style.display = "none"; return; }
      const fee = Number(store.info.delivery_fee || 0);
      bar.style.display = "flex";
      document.getElementById("cartCount").textContent = `${count} أصناف (التوصيل: ${fee.toLocaleString()})`;
      document.getElementById("cartTotal").textContent = (subtotal + fee).toLocaleString();
    }

    function sendOrder() {
      let lines = [`طلب جديد من *${store.info.name}*:`];
      let subtotal = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = (store.items || []).find(x => x.id === id);
        if (item) {
          const lineTotal = item.price * qty;
          subtotal += lineTotal;
          lines.push(`• ${item.name} × ${qty} = ${lineTotal.toLocaleString()} ${store.info.currency}`);
        }
      }
      const fee = Number(store.info.delivery_fee || 0);
      lines.push(`التوصيل: ${fee.toLocaleString()} ${store.info.currency}`);
      if (store.info.location_text) lines.push(`الموقع: ${store.info.location_text}`);
      lines.push(`*الإجمالي: ${(subtotal + fee).toLocaleString()} ${store.info.currency}*`);
      const phone = (store.info.phone_whatsapp || "").replace(/\D/g, "");
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(lines.join("\n"))}`;
      window.open(url, "_blank");
    }

    function toggleAdmin() {
      const panel = document.getElementById("adminPanel");
      panel.style.display = panel.style.display === "none" ? "block" : "none";
      const savedToken = localStorage.getItem("gh_gist_token");
      if (savedToken) document.getElementById("ghTokenInput").value = savedToken;
    }

    function unlockAdmin() {
      const pin = document.getElementById("pinInput").value.trim();
      const tok = document.getElementById("ghTokenInput").value.trim();
      if (pin !== String(store.subscription.admin_pin)) {
        alert("رمز PIN غير صحيح");
        return;
      }
      if (tok) localStorage.setItem("gh_gist_token", tok);
      document.getElementById("adminLogin").style.display = "none";
      renderAdminEditor();
    }

    function renderAdminEditor() {
      const ed = document.getElementById("adminEditor");
      ed.style.display = "block";
      const cats = store.categories || ["عام"];

      let html = `
        <h4 class="sec-title">هوية المحل، التواصل والموقع</h4>
        <label>اسم المحل:</label>
        <input type="text" id="adm_name" value="${store.info.name || ""}" />
        <label>لون المحل الأساسي:</label>
        <input type="color" id="adm_color" value="${store.info.theme_color || "#d97706"}" />
        <label>رقم الواتساب (مع رمز الدولة، مثال: 9639xxxxxxxx):</label>
        <input type="text" id="adm_phone" value="${store.info.phone_whatsapp || ""}" />
        <label>موقع المحل / العنوان:</label>
        <input type="text" id="adm_loc" value="${store.info.location_text || ""}" placeholder="مثال: دمشق - المزة أو رابط الخريطة" />
        <label>رسوم التوصيل:</label>
        <input type="number" id="adm_fee" value="${store.info.delivery_fee || 0}" />

        <h4 class="sec-title">إضافة عرض جديد</h4>
        <input type="text" id="new_offer_title" placeholder="عنوان العرض (مثال: عرض الجمعة على المعجنات)" />
        <input type="text" id="new_offer_desc" placeholder="تفاصيل العرض" />
        <input type="number" id="new_offer_price" placeholder="سعر العرض (اختياري)" />
        <button class="btn btn-dark" onclick="addNewOffer()">+ إضافة العرض</button>

        <div style="margin-top:10px;">
          ${(store.offers || []).map((o, idx) => `
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;padding:6px 0;">
              <span>🔥 <strong>${o.title}</strong> ${o.price ? `- ${Number(o.price).toLocaleString()}` : ""}</span>
              <button class="btn btn-danger" onclick="deleteOffer(${idx})">حذف</button>
            </div>
          `).join("")}
        </div>

        <h4 class="sec-title">إضافة صنف جديد</h4>
        <input type="text" id="new_name" placeholder="اسم الصنف الجديد" />
        <input type="text" id="new_desc" placeholder="وصف مختصر للصنف" />
        <input type="number" id="new_price" placeholder="السعر" />
        <input type="text" id="new_img" placeholder="رابط صورة الصنف (اختياري https://...)" />
        <select id="new_cat">
          ${cats.map(c => `<option value="${c}">${c}</option>`).join("")}
        </select>
        <button class="btn btn-dark" onclick="addNewItem()">+ إضافة الصنف للقائمة</button>

        <h4 class="sec-title">الأصناف الحالية</h4>
      `;

      html += (store.items || []).map((it, idx) => `
        <div style="border-bottom:1px solid #e2e8f0;padding:10px 0;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>${it.name}</strong>
            <button class="btn btn-danger" onclick="deleteItem(${idx})">حذف</button>
          </div>
          السعر: <input type="number" id="price_${idx}" value="${it.price}" style="width:130px;display:inline-block;" />
          <label style="margin-right:8px;"><input type="checkbox" id="avail_${idx}" ${it.available ? "checked" : ""} style="width:auto;" /> متوفر</label>
          <input type="text" id="img_${idx}" value="${it.image || ""}" placeholder="رابط صورة الصنف (اختياري)" />
        </div>
      `).join("");

      html += `<button class="btn btn-primary" style="margin-top:14px;width:100%;" onclick="saveToGist()">حفظ كل التعديلات في Gist</button>`;
      ed.innerHTML = html;
    }

    function syncInputsToMemory() {
      const nameEl = document.getElementById("adm_name");
      if (!nameEl) return;
      store.info.name = nameEl.value.trim() || store.info.name;
      store.info.theme_color = document.getElementById("adm_color").value || store.info.theme_color;
      store.info.phone_whatsapp = document.getElementById("adm_phone").value.trim();
      store.info.location_text = document.getElementById("adm_loc").value.trim();
      store.info.delivery_fee = Number(document.getElementById("adm_fee").value || 0);
      (store.items || []).forEach((it, idx) => {
        const pEl = document.getElementById(`price_${idx}`);
        const aEl = document.getElementById(`avail_${idx}`);
        const iEl = document.getElementById(`img_${idx}`);
        if (pEl) it.price = Number(pEl.value);
        if (aEl) it.available = aEl.checked;
        if (iEl) it.image = iEl.value.trim();
      });
    }

    function addNewOffer() {
      syncInputsToMemory();
      const title = document.getElementById("new_offer_title").value.trim();
      const desc = document.getElementById("new_offer_desc").value.trim();
      const price = Number(document.getElementById("new_offer_price").value || 0);
      if (!title) { alert("يرجى إدخال عنوان العرض."); return; }
      store.offers = store.offers || [];
      store.offers.push({ id: "o_" + Date.now(), title, desc, price });
      renderAdminEditor();
    }

    function deleteOffer(idx) {
      syncInputsToMemory();
      store.offers.splice(idx, 1);
      renderAdminEditor();
    }

    function addNewItem() {
      syncInputsToMemory();
      const name = document.getElementById("new_name").value.trim();
      const desc = document.getElementById("new_desc").value.trim();
      const price = Number(document.getElementById("new_price").value);
      const image = document.getElementById("new_img").value.trim();
      const category = document.getElementById("new_cat").value;
      if (!name || !price) {
        alert("يرجى إدخال اسم الصنف والسعر.");
        return;
      }
      store.items = store.items || [];
      store.items.push({
        id: "i_" + Date.now(),
        category,
        name,
        desc,
        price,
        image,
        available: true
      });
      renderAdminEditor();
    }

    function deleteItem(idx) {
      syncInputsToMemory();
      store.items.splice(idx, 1);
      renderAdminEditor();
    }

    async function saveToGist() {
      syncInputsToMemory();
      const tok = document.getElementById("ghTokenInput").value.trim() || localStorage.getItem("gh_gist_token");
      if (!tok) { alert("يرجى إدخال رمز GitHub Token"); return; }
      const res = await fetch(API_URL, {
        method: "PATCH",
        headers: { "Authorization": `Bearer ${tok}`, "Content-Type": "application/json" },
        body: JSON.stringify({ files: { "stores.json": { content: JSON.stringify(dbData, null, 2) } } })
      });
      if (res.ok) {
        alert("تم حفظ التعديلات بنجاح!");
        location.reload();
      } else {
        alert("فشل التحديث. تأكد من صلاحية gist في التوكن.");
      }
    }

    init();
  </script>
</body>
</html>
