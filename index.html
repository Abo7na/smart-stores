<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المنصة الذكية للمتاجر</title>
  <style>
    :root { --primary: #d97706; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 130px; }
    header { background: var(--primary); color: #fff; padding: 15px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 25; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    header h1 { margin: 0; font-size: 1.08rem; }
    .sub-tag { font-size: 0.78rem; opacity: 0.92; display: block; margin-top: 2px; }
    .btn { border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 0.86rem; text-decoration: none; display: inline-block; }
    .btn-light { background: rgba(255,255,255,.22); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-dark { background: #1e293b; color: #fff; }
    .btn-ok { background: #15803d; color: #fff; padding: 6px 10px; font-size: 0.82rem; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 0.82rem; }
    .btn-sec { background: #e2e8f0; color: #0f172a; padding: 6px 10px; font-size: 0.82rem; }
    .container { max-width: 780px; margin: 14px auto; padding: 0 14px; }
    .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; font-weight: 600; font-size: 0.9rem; line-height: 1.5; }
    .alert-warn { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    .alert-err { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #22c55e; }
    .alert-info { background: #e0f2fe; color: #075985; border: 1px solid #38bdf8; }
    .store-meta { background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.86rem; color: var(--muted); border: 1px solid #e2e8f0; }
    .ad-banner { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ad-badge { background: #e2e8f0; color: #475569; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; }
    .offers-box { margin-bottom: 12px; }
    .offer-card { background: linear-gradient(135deg, #fffbeb, #ffffff); border: 1px dashed var(--primary); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
    .offer-title { font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .search-box { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 12px; font-size: 0.95rem; background: #fff; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .cat-btn { background: var(--card); border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 14px; white-space: nowrap; cursor: pointer; font-size: 0.88rem; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .item-card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid #e2e8f0; flex-shrink: 0; }
    .item-title { font-weight: 700; margin-bottom: 4px; }
    .item-desc { color: var(--muted); font-size: 0.84rem; margin-bottom: 6px; }
    .item-price { font-weight: 700; color: var(--primary); }
    .qty-box { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-weight: bold; cursor: pointer; }
    .panel { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 14px; border: 1px solid #e2e8f0; }
    input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 6px; margin-bottom: 10px; background: #fff; font-size: 0.9rem; }
    input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }
    .badge-off { background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; }
    .checkout-box { background: var(--card); border-radius: 12px; padding: 14px; margin-top: 14px; border: 1px solid #cbd5e1; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 30; box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
    .admin-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { background: #f1f5f9; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
    .stat-val { font-size: 1.15rem; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .order-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .st-pending { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .st-completed { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .st-rejected { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .sec-title { margin: 16px 0 8px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .creator-footer { margin-top: 28px; background: #0f172a; color: #f8fafc; border-radius: 14px; padding: 16px; text-align: center; }
    .creator-footer p { margin: 6px 0 12px; font-size: 0.88rem; color: #cbd5e1; }
    .lock-card { background: #fff; border: 2px solid #ef4444; border-radius: 14px; padding: 18px; margin: 16px 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="storeName">جاري التحميل...</h1>
      <span class="sub-tag" id="storeTypeTag"></span>
    </div>
    <div id="headerActions">
      <button id="myOrdersBtn" class="btn btn-light" onclick="toggleMyOrders()">طلباتي</button>
    </div>
  </header>

  <div class="container" id="mainContainer">
    <div id="subBanner"></div>
    <div id="closedBanner"></div>
    <div id="orderSuccessBanner"></div>

    <!-- متابعة طلبات الزبون (مقيدة بجهاز الزبون فقط لمنع التجسس) -->
    <div id="myOrdersPanel" class="panel" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">طلباتي على هذا الجهاز</h3>
        <div>
          <button class="btn btn-sec" onclick="renderCustomerOrders()">🔄 تحديث</button>
          <button class="btn btn-sec" onclick="toggleMyOrders()">إغلاق</button>
        </div>
      </div>
      <div id="customerOrdersList" style="margin-top:12px;"></div>
    </div>

    <div id="storeContent">
      <div id="adSlot"></div>
      <div id="storeMeta" class="store-meta" style="display:none;"></div>
      <div id="offersBox" class="offers-box" style="display:none;"></div>
      <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن صنف أو منتج..." oninput="renderMenu()" style="display:none;" />
      <div class="cats" id="catsBar"></div>
      <div id="itemsList"></div>

      <div id="checkoutBox" class="checkout-box" style="display:none;">
        <h3 style="margin-top:0;">بيانات الطلب والدفع</h3>
        <label>رقم الهاتف (يُحفظ تلقائياً ويفعّل خصم الطلبات المتكررة):</label>
        <input type="tel" id="custPhone" placeholder="مثال: 09xxxxxxxx" oninput="checkCustomerLoyalty()" />
        <div id="loyaltyMsg" style="font-size:0.85rem;color:#15803d;font-weight:700;margin-bottom:8px;"></div>

        <label>الاسم الكامل:</label>
        <input type="text" id="custName" placeholder="اكتب اسمك" />

        <div id="deliveryFields">
          <label>العنوان التفصيلي:</label>
          <input type="text" id="custAddress" placeholder="الحي، الشارع، البناء..." />
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
            <button type="button" class="btn btn-sec" onclick="shareGPS()">📍 مشاركة موقعي الحالي (GPS)</button>
            <span id="gpsStatus" style="font-size:0.8rem;color:var(--muted);"></span>
          </div>
          <input type="hidden" id="custGPS" />
        </div>

        <div id="barberFields" style="display:none;">
          <label>تاريخ الموعد:</label>
          <input type="date" id="bookDate" />
          <label>الوقت المفضل:</label>
          <input type="time" id="bookTime" />
        </div>

        <div id="retailOptionField" style="display:none;">
          <label>المقاس / اللون / ملاحظة على المنتج:</label>
          <input type="text" id="itemVariantNote" placeholder="مثال: مقاس L - لون أسود" />
        </div>

        <label>كوبون خصم (إن وجد):</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="couponCode" placeholder="أدخل كود الخصم" style="margin:0;" />
          <button type="button" class="btn btn-dark" onclick="applyCoupon()">تطبيق</button>
        </div>
        <div id="couponMsg" style="font-size:0.84rem;margin:6px 0 10px;font-weight:600;"></div>

        <label>طريقة الدفع:</label>
        <select id="payMethod" onchange="toggleShamCashBox()">
          <option value="manual">دفع يدوي / عند الاستلام</option>
          <option value="shamcash">عبر شام كاش (ShamCash)</option>
        </select>

        <div id="shamCashBox" style="display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-bottom:10px;">
          <div id="shamCashInfo" style="font-size:0.86rem;font-weight:700;margin-bottom:6px;"></div>
          <label>رقم عملية / مرجع تحويل شام كاش:</label>
          <input type="text" id="shamCashRef" placeholder="أدخل رقم العملية بعد التحويل" />
        </div>
      </div>
    </div>

    <!-- منطقة الإدارة الديناميكية (تُبنى فقط في وضع الإدارة وبعد التحقق) -->
    <div id="dynamicAdminHost"></div>

    <!-- بطاقة منشئ المنصة المركزية (تتحدث تلقائياً على جميع المتاجر) -->
    <div id="creatorFooterHost"></div>
  </div>

  <div class="cart-bar" id="cartBar" style="display:none;">
    <div>
      <div>الإجمالي: <strong id="cartTotal">0</strong> <span id="currLabel"></span></div>
      <small id="cartSummarySub" style="color:var(--muted)"></small>
    </div>
    <button id="submitOrderBtn" class="btn btn-primary" onclick="submitOrder()">إرسال الطلب للمحل</button>
  </div>

  <script>
    // =========================================================
    // 1. طبقة الاتصال بقاعدة البيانات (قابلة للنقل لأي استضافة مدفوعة)
    // =========================================================
    const DB_CONFIG = {
      mode: "gist", // مستقبلاً يمكن تغييره إلى "custom_api"
      gistId: "29a880a7f2a8e52e7ca8192168eae9e9",
      customApiUrl: "",
      // ضع نصفي توكن Gists (Read & Write) هنا
      kPart1: "github_pat_11BSJON7I0jeJRVjfLge5q_vhGUYtbe8bT0TuZyuGIhglY8mSjw5",
      kPart2: "SjWUz0UUEqGwguKB4KCSXBgiXfroKX",
      // رمز دخولك السري كمالك للمنصة (غيّره لرمز قوي خاص بك)
      superAdminPin: "asmaa1993"
    };

    (function captureSecretKeyFromHash() {
      if (location.hash && location.hash.startsWith("#key=")) {
        const rawKey = decodeURIComponent(location.hash.slice(5)).trim();
        if (rawKey) localStorage.setItem("smart_store_sync_key", rawKey);
        history.replaceState(null, "", location.pathname + location.search);
      }
    })();

    function getSyncToken() {
      const stored = localStorage.getItem("smart_store_sync_key");
      if (stored) return stored;
      const combined = (DB_CONFIG.kPart1 + DB_CONFIG.kPart2).trim();
      if (combined && !combined.includes("ضع_النصف")) return combined;
      return "";
    }

    const DB_ADAPTER = {
      async load() {
        if (DB_CONFIG.mode === "custom_api") {
          const res = await fetch(DB_CONFIG.customApiUrl, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        }
        const res = await fetch(`https://api.github.com/gists/${DB_CONFIG.gistId}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const gist = await res.json();
        const fileObj = gist.files["stores.json"] || Object.values(gist.files)[0];
        if (!fileObj || !fileObj.content) throw new Error("ملف stores.json فارغ");
        return JSON.parse(fileObj.content);
      },
      async save(fullData) {
        const token = getSyncToken();
        if (!token) return false;
        if (DB_CONFIG.mode === "custom_api") {
          const res = await fetch(DB_CONFIG.customApiUrl, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify(fullData)
          });
          return res.ok;
        }
        const res = await fetch(`https://api.github.com/gists/${DB_CONFIG.gistId}`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ files: { "stores.json": { content: JSON.stringify(fullData, null, 2) } } })
        });
        return res.ok;
      }
    };

    // =========================================================
    // 2. المتغيرات والتهيئة العامة
    // =========================================================
    const params = new URLSearchParams(location.search);
    const storeId = params.get("store") || "bakery1";
    const isStoreAdminRoute = params.get("admin") === "1";
    const isSuperAdminRoute = params.get("superadmin") === "1";

    const TEMPLATES = {
      bakery: {
        label: "معجنات ومخبوزات ومطاعم",
        categories: ["مناقيش", "بيتزا", "معجنات", "مشروبات"],
        sampleItems: [
          { id: "i_1", category: "مناقيش", name: "منقوشة زعتر بلدي", desc: "زعتر مع زيت زيتون", price: 15000, available: true },
          { id: "i_2", category: "بيتزا", name: "بيتزا خضار وسط", desc: "فطر، زيتون، فليفلة، جبنة", price: 45000, available: true }
        ]
      },
      market: {
        label: "سوبر ماركت ومواد غذائية",
        categories: ["مواد غذائية", "ألبان وأجبان", "منظفات", "مشروبات"],
        sampleItems: [
          { id: "i_1", category: "مواد غذائية", name: "أرز بسمتي 1 كغ", desc: "حبة طويلة فاخر", price: 22000, available: true },
          { id: "i_2", category: "ألبان وأجبان", name: "لبنة بلدية 500 غ", desc: "طازجة يومياً", price: 18000, available: true }
        ]
      },
      tobacco: {
        label: "مركز تبغ ومعسل",
        categories: ["معسل", "فحم", "مستلزمات أراكيل", "مشروبات"],
        sampleItems: [
          { id: "i_1", category: "معسل", name: "معسل تفاحتين فاخر 250 غ", desc: "نكهة أصلية", price: 35000, available: true },
          { id: "i_2", category: "فحم", name: "فحم جوز الهند 1 كغ", desc: "سريع الاشتعال وبدون رائحة", price: 25000, available: true }
        ]
      },
      barber: {
        label: "صالون حلاقة وحجز مواعيد",
        categories: ["قص شعر", "حلاقة ذقن", "عناية وبشرة", "باقات"],
        sampleItems: [
          { id: "i_1", category: "قص شعر", name: "قصة شعر عصرية", desc: "مع غسيل وتصفيف", price: 30000, available: true },
          { id: "i_2", category: "باقات", name: "باقة عريس / VIP", desc: "شعر + ذقن + تنظيف بشرة", price: 75000, available: true }
        ]
      },
      retail: {
        label: "ملابس وإلكترونيات وهدايا",
        categories: ["رجالي", "نسائي", "إكسسوارات", "عروض"],
        sampleItems: [
          { id: "i_1", category: "رجالي", name: "تيشيرت قطن 100%", desc: "متوفر بعدة مقاسات وألوان", price: 85000, available: true }
        ]
      },
      custom: {
        label: "متجر متنوع",
        categories: ["الرئيسية", "عروض"],
        sampleItems: [
          { id: "i_1", category: "الرئيسية", name: "منتج تجريبي 1", desc: "وصف المنتج", price: 20000, available: true }
        ]
      }
    };

    let dbData = null;
    let store = null;
    let activeCat = "الكل";
    let cart = {};
    let isLocked = false;
    let lockDetails = null;
    let appliedCoupon = null;
    let loyaltyDiscountPct = 0;
    let activeAdminTab = "orders";
    let ordersFilter = "pending";
    let activeSuperTab = "stores";
    let superFilter = "all";

    function getDeviceClientId() {
      let cid = localStorage.getItem("smart_store_device_cid");
      if (!cid) {
        cid = "CID_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
        localStorage.setItem("smart_store_device_cid", cid);
      }
      return cid;
    }

    function checkRateLimit(scopeKey) {
      const raw = JSON.parse(localStorage.getItem("rl_" + scopeKey) || '{"fails":0,"until":0}');
      if (Date.now() < raw.until) {
        const mins = Math.ceil((raw.until - Date.now()) / 60000);
        alert(`تم قفل المحاولة مؤقتاً بسبب تكرار الرمز الخاطئ. حاول بعد ${mins} دقيقة.`);
        return false;
      }
      return true;
    }

    function recordAuthResult(scopeKey, success) {
      if (success) {
        localStorage.removeItem("rl_" + scopeKey);
        return;
      }
      const raw = JSON.parse(localStorage.getItem("rl_" + scopeKey) || '{"fails":0,"until":0}');
      raw.fails += 1;
      if (raw.fails >= 5) {
        raw.until = Date.now() + 5 * 60 * 1000;
        raw.fails = 0;
      }
      localStorage.setItem("rl_" + scopeKey, JSON.stringify(raw));
    }

    async function fetchFreshDB() {
      dbData = await DB_ADAPTER.load();
      ensureGlobalStructure();
      store = dbData.stores[storeId];
      if (store) ensureStoreStructure();
    }

    function ensureGlobalStructure() {
      dbData.platform_settings = dbData.platform_settings || {};
      const ps = dbData.platform_settings;
      ps.platform_name = ps.platform_name || "منصة المتاجر الذكية";
      ps.creator_name = ps.creator_name || "إدارة المنصة";
      ps.creator_whatsapp = ps.creator_whatsapp || "963900000000";
      ps.creator_link = ps.creator_link || "";
      ps.promo_tagline = ps.promo_tagline || "هل ترغب بموقع إلكتروني خاص بمتجرك أو مشروعك؟ تواصل معنا الآن!";
      ps.shamcash_code = ps.shamcash_code || "غير محدد بعد";
      ps.shamcash_name = ps.shamcash_name || "مدير المنصة";
      ps.monthly_fee_text = ps.monthly_fee_text || "100,000 ل.س / شهرياً";
      ps.warning_days = ps.warning_days ?? 3;
      ps.default_grace_days = ps.default_grace_days ?? 3;
      ps.ads = ps.ads || [];
      dbData.stores = dbData.stores || {};
    }

    function ensureStoreStructure() {
      store.info = store.info || {};
      store.owner = store.owner || { name: "", phone: "", city: "", notes: "" };
      store.subscription = store.subscription || { admin_pin: "1122", plan_type: "trial", plan_days: 7, start_date: "", expiry_date: "", grace_days: 3, status: "active", show_ads: true };
      if (store.subscription.show_ads === undefined) store.subscription.show_ads = true;
      store.items = store.items || [];
      store.offers = store.offers || [];
      store.categories = store.categories || ["عام"];
      store.customers = store.customers || {};
      store.orders = store.orders || [];
      store.promos = store.promos || { loyalty: { enabled: false, every_n_orders: 3, discount_percent: 10 }, coupons: [] };
      store.promos.loyalty = store.promos.loyalty || { enabled: false, every_n_orders: 3, discount_percent: 10 };
      store.promos.coupons = store.promos.coupons || [];
    }

    async function init() {
      getDeviceClientId();
      try {
        await fetchFreshDB();

        // وضع السوبر أدمن (خاص بك وحدك)
        if (isSuperAdminRoute) {
          document.title = "لوحة تحكم مالك المنصة";
          document.getElementById("storeName").textContent = dbData.platform_settings.platform_name;
          document.getElementById("storeTypeTag").textContent = "لوحة تحكم مالك المنصة (Super Admin)";
          document.getElementById("myOrdersBtn").style.display = "none";
          document.getElementById("storeContent").style.display = "none";
          renderSuperAdminLogin();
          return;
        }

        if (!store) {
          document.getElementById("storeName").textContent = "المتجر غير موجود";
          document.getElementById("storeContent").innerHTML = `<div class="alert alert-err">لم يتم العثور على المتجر المطلوب (${storeId}).</div>`;
          renderCreatorFooter();
          return;
        }

        applyTheme();
        evaluateSubscription();
        renderCreatorFooter();

        if (isStoreAdminRoute) {
          renderStoreAdminLogin();
        }

        if (!isLocked) {
          renderGlobalAd();
          renderMeta();
          renderOffers();
          checkOpenStatus();
          loadSavedCustomerLocal();
          renderMenu();
        }
      } catch (e) {
        document.getElementById("storeName").textContent = "تعذر التحميل";
        document.getElementById("storeContent").innerHTML = `<div class="alert alert-err">سبب المشكلة: ${e.message}</div>`;
      }
    }

    // =========================================================
    // 3. التحقق من الاشتراك والقفل التلقائي + الدفع عبر شام كاش
    // =========================================================
    function evaluateSubscription() {
      const sub = store.subscription || {};
      const ps = dbData.platform_settings;
      const warnDays = Number(ps.warning_days ?? 3);
      const graceDays = Number(sub.grace_days ?? ps.default_grace_days ?? 3);
      const banner = document.getElementById("subBanner");

      if (!sub.expiry_date) {
        lockDetails = { active: true, daysLeft: 999, statusText: "مفعّل" };
        return;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const exp = new Date(sub.expiry_date + "T00:00:00");
      const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));

      if (diffDays < -graceDays || sub.status === "suspended") {
        isLocked = true;
        lockDetails = { active: false, diffDays, expiry: sub.expiry_date };
        document.getElementById("storeContent").style.display = "none";
        document.getElementById("cartBar").style.display = "none";
        document.getElementById("myOrdersBtn").style.display = "none";

        const wp = String(ps.creator_whatsapp || "").replace(/\D/g, "");
        const renewMsg = encodeURIComponent(`مرحباً ${ps.creator_name}، أرغب بتجديد اشتراك متجر "${store.info.name}" (${storeId}). تم تحويل مبلغ الاشتراك عبر شام كاش.`);
        banner.innerHTML = `
          <div class="lock-card">
            <h3 style="margin-top:0;color:#b91c1c;">🔒 تم إيقاف المتجر مؤقتاً لانتهاء مدة الاشتراك</h3>
            <p style="font-size:0.9rem;">انتهت فترة ${sub.plan_type === "trial" ? "التجربة المجانية" : "الاشتراك"} بتاريخ <strong>${sub.expiry_date}</strong> وانقضت مهلة السماح.</p>
            <div class="alert alert-info">
              <strong>لتفعيل البرنامج فوراً، يرجى تحويل قيمة الاشتراك عبر شام كاش:</strong><br/>
              • قيمة الاشتراك: <strong>${ps.monthly_fee_text}</strong><br/>
              • حساب / معرّف شام كاش: <strong>${ps.shamcash_code}</strong><br/>
              • اسم المستفيد: <strong>${ps.shamcash_name}</strong>
            </div>
            ${wp ? `<a class="btn btn-ok" style="width:100%;text-align:center;" href="https://wa.me/${wp}?text=${renewMsg}" target="_blank">📲 إرسال إشعار الدفع وتفعيل المتجر عبر واتساب</a>` : ""}
          </div>
        `;
      } else {
        lockDetails = {
          active: true,
          diffDays,
          expiry: sub.expiry_date,
          planDays: sub.plan_days || 30,
          planType: sub.plan_type === "trial" ? "تجربة مجانية" : "اشتراك مفعّل"
        };
        if (diffDays <= 0 && isStoreAdminRoute) {
          banner.innerHTML = `<div class="alert alert-warn">⚠️ انتهى اشتراكك بتاريخ (${sub.expiry_date})! لديك مهلة سماح (${graceDays} أيام) قبل الإغلاق التلقائي.</div>`;
        } else if (diffDays <= warnDays && isStoreAdminRoute) {
          banner.innerHTML = `<div class="alert alert-warn">تنبيه: ينتهي اشتراك متجرك خلال ${diffDays} يوم (${sub.expiry_date}).</div>`;
        }
      }
    }

    function checkOpenStatus() {
      const cb = document.getElementById("closedBanner");
      cb.innerHTML = store.info.is_open === false
        ? `<div class="alert alert-warn">المتجر مغلق مؤقتاً لاستقبال الطلبات حالياً.</div>`

    function loadSavedCustomerLocal() {
      const saved = JSON.parse(localStorage.getItem("smart_store_customer_" + storeId) || "null");
      if (!saved) return;
      if (saved.phone) document.getElementById("custPhone").value = saved.phone;
      if (saved.name) document.getElementById("custName").value = saved.name;
      if (saved.address) document.getElementById("custAddress").value = saved.address;
      if (saved.gps) {
        document.getElementById("custGPS").value = saved.gps;
        document.getElementById("gpsStatus").textContent = "تم حفظ الموقع مسبقاً ✓";
      }
      checkCustomerLoyalty();
    }

    function checkCustomerLoyalty() {
      const phone = document.getElementById("custPhone").value.trim();
      const msgEl = document.getElementById("loyaltyMsg");
      loyaltyDiscountPct = 0;
      const loy = store.promos.loyalty || {};
      const cust = store.customers[phone];

      if (!phone || !loy.enabled || !loy.every_n_orders) {
        msgEl.textContent = "";
        updateTotals();
        return;
      }
      const completedCount = cust ? Number(cust.completed_orders || 0) : 0;
      const nextOrderNum = completedCount + 1;
      if (nextOrderNum % Number(loy.every_n_orders) === 0) {
        loyaltyDiscountPct = Number(loy.discount_percent || 0);
        msgEl.textContent = `🎉 زبون مميز! هذا طلبك رقم (${nextOrderNum}) ويستحق خصم ولاء ${loyaltyDiscountPct}% تلقائياً.`;
      } else {
        const rem = Number(loy.every_n_orders) - (nextOrderNum % Number(loy.every_n_orders));
        msgEl.textContent = `طلباتك المنفذة: ${completedCount} (يتبقى ${rem} طلب لخصم ${loy.discount_percent}%).`;
      }
      updateTotals();
    }

    function shareGPS() {
      const st = document.getElementById("gpsStatus");
      if (!navigator.geolocation) { st.textContent = "المتصفح لا يدعم GPS"; return; }
      st.textContent = "جاري تحديد الموقع...";
      navigator.geolocation.getCurrentPosition(pos => {
        const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        document.getElementById("custGPS").value = link;
        st.textContent = "تم تحديد الموقع ✓";
      }, () => {
        st.textContent = "تعذر الوصول للموقع";
      });
    }

    function applyCoupon() {
      const code = document.getElementById("couponCode").value.trim().toUpperCase();
      const msg = document.getElementById("couponMsg");
      appliedCoupon = null;
      if (!code) { msg.textContent = ""; updateTotals(); return; }
      const found = (store.promos.coupons || []).find(c => c.active && String(c.code || "").toUpperCase() === code);
      if (!found) {
        msg.style.color = "#b91c1c";
        msg.textContent = "كوبون غير صالح أو غير مفعّل.";
      } else {
        appliedCoupon = found;
        msg.style.color = "#15803d";
        msg.textContent = `تم تفعيل الكوبون (${found.code}) بخصم ${found.type === "percent" ? found.value + "%" : Number(found.value).toLocaleString() + " " + (store.info.currency || "")}.`;
      }
      updateTotals();
    }

    function toggleShamCashBox() {
      const m = document.getElementById("payMethod").value;
      document.getElementById("shamCashBox").style.display = m === "shamcash" ? "block" : "none";
    }

    function renderMenu() {
      const cats = ["الكل", ...store.categories];
      document.getElementById("catsBar").innerHTML = cats.map(c =>
        `<button class="cat-btn ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`
      ).join("");

      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const filtered = store.items.filter(i => {
        const mc = activeCat === "الكل" || i.category === activeCat;
        const ms = !q || i.name.toLowerCase().includes(q) || (i.desc || "").toLowerCase().includes(q);
        return mc && ms;
      });

      document.getElementById("itemsList").innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        const imgTag = item.image ? `<img src="${item.image}" alt="${item.name}" class="item-img" onerror="this.style.display='none'" />` : "";
        return `
          <div class="item-card">
            <div class="item-left">
              ${imgTag}
              <div>
                <div class="item-title">${item.name} ${!item.available ? '<span class="badge-off">نفد</span>' : ''}</div>
                <div class="item-desc">${item.desc || ""}</div>
                <div class="item-price">${Number(item.price).toLocaleString()} ${store.info.currency || ""}</div>
              </div>
            </div>
            <div class="qty-box">
              ${item.available ? `
                <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                <span>${qty}</span>
                <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
              ` : `<small style="color:var(--muted)">غير متوفر</small>`}
            </div>
          </div>
        `;
      }).join("");
      updateTotals();
    }

    function setCat(c) { activeCat = c; renderMenu(); }

    function changeQty(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) delete cart[id];
      else cart[id] = next;
      renderMenu();
    }

    function calculateTotals() {
      let count = 0, subtotal = 0;
      const lines = [];
      for (const [id, qty] of Object.entries(cart)) {
        const it = store.items.find(x => x.id === id);
        if (it) {
          count += qty;
          const lineSum = Number(it.price) * qty;
          subtotal += lineSum;
          lines.push({ id: it.id, name: it.name, qty, price: Number(it.price), total: lineSum });
        }
      }
      let discount = 0;
      if (loyaltyDiscountPct > 0) discount += Math.round((subtotal * loyaltyDiscountPct) / 100);
      if (appliedCoupon) {
        if (appliedCoupon.type === "percent") discount += Math.round((subtotal * Number(appliedCoupon.value || 0)) / 100);
        else discount += Number(appliedCoupon.value || 0);
      }
      if (discount > subtotal) discount = subtotal;

      const isBarber = (store.info.type || "bakery") === "barber";
      const deliveryFee = isBarber ? 0 : (store.info.delivery_type === "free" ? 0 : Number(store.info.delivery_fee || 0));
      const finalTotal = Math.max(0, subtotal - discount + deliveryFee);
      return { count, subtotal, discount, deliveryFee, finalTotal, lines };
    }

    function updateTotals() {
      const t = calculateTotals();
      const bar = document.getElementById("cartBar");
      const checkout = document.getElementById("checkoutBox");
      if (t.count === 0) {
        bar.style.display = "none";
        checkout.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      checkout.style.display = "block";
      document.getElementById("cartTotal").textContent = t.finalTotal.toLocaleString();
      document.getElementById("cartSummarySub").textContent =
        `${t.count} أصناف | خصم: ${t.discount.toLocaleString()} | توصيل: ${t.deliveryFee.toLocaleString()}`;
    }

    async function submitOrder() {
      if (store.info.is_open === false) { alert("المتجر مغلق مؤقتاً لاستقبال الطلبات."); return; }
      const phone = document.getElementById("custPhone").value.trim();
      const name = document.getElementById("custName").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const gps = document.getElementById("custGPS").value.trim();
      const payMethod = document.getElementById("payMethod").value;
      const shamRef = document.getElementById("shamCashRef").value.trim();
      const isBarber = (store.info.type || "bakery") === "barber";
      const bookDate = document.getElementById("bookDate").value;
      const bookTime = document.getElementById("bookTime").value;
      const variantNote = (document.getElementById("itemVariantNote").value || "").trim();

      if (!phone || !name) { alert("يرجى إدخال رقم الهاتف والاسم."); return; }
      if (!isBarber && !address && !gps) { alert("يرجى إدخال العنوان أو مشاركة الموقع GPS."); return; }
      if (isBarber && (!bookDate || !bookTime)) { alert("يرجى اختيار تاريخ ووقت الموعد."); return; }
      if (payMethod === "shamcash" && !shamRef) { alert("يرجى إدخال رقم عملية تحويل شام كاش."); return; }

      const btn = document.getElementById("submitOrderBtn");
      btn.disabled = true;
      btn.textContent = "جاري إرسال الطلب...";

      try {
        await fetchFreshDB();
        const t = calculateTotals();
        const orderId = "ORD" + String(Date.now()).slice(-5);
        let summaryText = t.lines.map(l => `${l.name} × ${l.qty}`).join(" ، ");
        if (variantNote) summaryText += ` (${variantNote})`;

        const deviceCid = getDeviceClientId();
        store.orders.unshift({
          id: orderId,
          client_id: deviceCid,
          customer_phone: phone,
          customer_name: name,
          address: isBarber ? `موعد: ${bookDate} ${bookTime}` : address,
          gps,
          summary: summaryText,
          total: t.finalTotal,
          pay_method: payMethod,
          sham_ref: shamRef,
          status: "pending",
          created_at: new Date().toISOString().slice(0, 16).replace("T", " ")
        });

        upsertCustomer(phone, name, 0, 0, address, gps);
        localStorage.setItem("smart_store_customer_" + storeId, JSON.stringify({ phone, name, address, gps }));

        const ok = await DB_ADAPTER.save(dbData);
        if (!ok) {
          alert("تعذر إرسال الطلب حالياً. تأكد من مفتاح المزامنة.");
          return;
        }

        cart = {};
        appliedCoupon = null;
        renderMenu();
        document.getElementById("orderSuccessBanner").innerHTML = `
          <div class="alert alert-ok">
            ✅ تم إرسال طلبك بنجاح برقم <strong>#${orderId}</strong>.<br/>
            يمكنك متابعة حالة تنفيذ الطلب والفاتورة من زر <strong>"طلباتي"</strong> في الأعلى (مرتبط بجهازك بأمان).
          </div>
        `;
        window.scrollTo({ top: 0, behavior: "smooth" });
      } finally {
        btn.disabled = false;
        btn.textContent = "إرسال الطلب للمحل";
      }
    }

    function toggleMyOrders() {
      const p = document.getElementById("myOrdersPanel");
      p.style.display = p.style.display === "none" ? "block" : "none";
      if (p.style.display === "block") renderCustomerOrders();
    }

    async function renderCustomerOrders() {
      const listEl = document.getElementById("customerOrdersList");
      listEl.innerHTML = `<small>جاري التحديث...</small>`;
      await fetchFreshDB();
      const deviceCid = getDeviceClientId();
      const curr = store.info.currency || "";
      // لا يعرض إلا الطلبات المنشأة من هذا الجهاز فقط لمنع التجسس
      const myOrders = (store.orders || []).filter(o => o.client_id === deviceCid);

      if (myOrders.length === 0) {
        listEl.innerHTML = `<p style="color:var(--muted);font-size:0.88rem;">لا توجد طلبات مسجلة من هذا الجهاز حتى الآن.</p>`;
        return;
      }

      const activeList = myOrders.filter(o => o.status === "pending");
      const archivedList = myOrders.filter(o => o.status !== "pending");

      const renderCard = (o) => {
        const st = o.status === "completed"
          ? `<span class="st-completed">منفذ (فاتورة معتمدة)</span>`
          : o.status === "rejected"
          ? `<span class="st-rejected">مرفوض</span>`
          : `<span class="st-pending">قيد التنفيذ والمراجعة</span>`;
        return `
          <div class="order-card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong>طلب #${o.id}</strong>
              ${st}
            </div>
            <div style="font-size:0.86rem;margin-top:6px;">${o.summary}</div>
            <div style="font-size:0.84rem;margin-top:4px;">الإجمالي: <strong>${Number(o.total || 0).toLocaleString()} ${curr}</strong></div>
            ${o.delivery_eta ? `<div class="alert alert-ok" style="margin-top:8px;margin-bottom:0;">🧾 موعد التسليم المتوقع: <strong>${o.delivery_eta}</strong></div>` : ""}
            ${o.reject_reason ? `<div class="alert alert-err" style="margin-top:8px;margin-bottom:0;">نعتذر، سبب الرفض: ${o.reject_reason}</div>` : ""}
          </div>
        `;
      };

      listEl.innerHTML = `
        <h4 class="sec-title">⏳ طلبات قيد التنفيذ (${activeList.length})</h4>
        ${activeList.length === 0 ? `<p style="color:var(--muted);font-size:0.85rem;">لا توجد طلبات قيد الانتظار حالياً.</p>` : activeList.map(renderCard).join("")}
        <h4 class="sec-title">✅ سجل الطلبات المنفذة والسابقة (${archivedList.length})</h4>
        ${archivedList.length === 0 ? `<p style="color:var(--muted);font-size:0.85rem;">لا توجد طلبات منفذة سابقة بعد.</p>` : archivedList.map(renderCard).join("")}
      `;

    // =========================================================

    async function resetStoreOrders() {

      store.orders = [];
      await saveWithAlert(true);

      store.customers = {};
      await saveWithAlert(true);
      renderCustomersTab();

    function upsertCustomer(phone, name, addCompletedCount, addSpent, address, gps) {
      if (!phone) return;
      store.customers[phone] = store.customers[phone] || {
        name: name || "", phone, address: address || "", gps: gps || "", completed_orders: 0, total_spent: 0, last_order_at: ""
      };
      if (name) store.customers[phone].name = name;
      if (address) store.customers[phone].address = address;
      if (gps) store.customers[phone].gps = gps;
      store.customers[phone].completed_orders = Number(store.customers[phone].completed_orders || 0) + Number(addCompletedCount || 0);
      store.customers[phone].total_spent = Number(store.customers[phone].total_spent || 0) + Number(addSpent || 0);
      store.customers[phone].last_order_at = new Date().toISOString().slice(0, 10);
    }

    async function approveOrder(orderId) {
      const ord = store.orders.find(x => x.id === orderId);
      if (!ord) return;
      ord.delivery_eta = document.getElementById(`eta_${orderId}`).value.trim() || "في أقرب وقت";
      ord.status = "completed";
      upsertCustomer(ord.customer_phone, ord.customer_name, 1, ord.total, ord.address, ord.gps);
      await saveWithAlert(true);
      renderOrdersTab();
    }

    async function rejectOrder(orderId) {
      const ord = store.orders.find(x => x.id === orderId);
      if (!ord) return;
      ord.reject_reason = document.getElementById(`rej_${orderId}`).value.trim() || "تعذر تنفيذ الطلب حالياً";
      ord.status = "rejected";
      await saveWithAlert(true);
      renderOrdersTab();
    }

      store.offers.push({ id: "o_" + Date.now(), title, desc, price });
      await saveWithAlert(true);
      renderItemsTab();

    async function addItem() {
      const name = document.getElementById("new_name").value.trim();
      const desc = document.getElementById("new_desc").value.trim();
      const price = Number(document.getElementById("new_price").value);
      const image = document.getElementById("new_img").value.trim();
      const category = document.getElementById("new_cat").value;
      if (!name || !price) { alert("أدخل اسم الصنف والسعر."); return; }
      store.items.push({ id: "i_" + Date.now(), category, name, desc, price, image, available: true });

      renderItemsTab();

    function getStoreSubDaysLeft(st) {
      const expStr = st.subscription && st.subscription.expiry_date;
      if (!expStr) return 999;
      const today = new Date(); today.setHours(0,0,0,0);
      const exp = new Date(expStr + "T00:00:00");
      return Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
    }

    function renderSuperStoresTab() {
      const entries = Object.entries(dbData.stores || {});
      const expiringSoon = entries.filter(([, s]) => { const d = getStoreSubDaysLeft(s); return d >= 0 && d <= 3; });
      const expired = entries.filter(([, s]) => getStoreSubDaysLeft(s) < 0 || (s.subscription && s.subscription.status === "suspended"));

      const filtered = entries.filter(([, s]) => {
        const d = getStoreSubDaysLeft(s);
        if (superFilter === "expiring") return d >= 0 && d <= 3;
        if (superFilter === "expired") return d < 0 || (s.subscription && s.subscription.status === "suspended");
        return true;
      });

      const baseUrl = location.origin + location.pathname;
      const ps = dbData.platform_settings;

      document.getElementById("superTabBody").innerHTML = `
        <div class="stats-grid">
          <div class="stat-card"><div>إجمالي المتاجر</div><div class="stat-val">${entries.length}</div></div>
          <div class="stat-card"><div>تنتهي قريباً (≤3 أيام)</div><div class="stat-val">${expiringSoon.length}</div></div>
          <div class="stat-card"><div>منتهية / موقوفة</div><div class="stat-val">${expired.length}</div></div>
          <div class="stat-card"><div>الإعلانات النشطة</div><div class="stat-val">${(ps.ads || []).filter(a => a.active).length}</div></div>
        </div>

        <div class="cats">
          <button class="cat-btn ${superFilter==='all'?'active':''}" onclick="superFilter='all';renderSuperStoresTab()">الكل (${entries.length})</button>
          <button class="cat-btn ${superFilter==='expiring'?'active':''}" onclick="superFilter='expiring';renderSuperStoresTab()">تنتهي قريباً (${expiringSoon.length})</button>
          <button class="cat-btn ${superFilter==='expired'?'active':''}" onclick="superFilter='expired';renderSuperStoresTab()">منتهية (${expired.length})</button>
        </div>

        ${filtered.map(([id, st]) => {
          const sub = st.subscription || {};
          const ow = st.owner || {};
          const dLeft = getStoreSubDaysLeft(st);
          const badge = dLeft < 0 || sub.status === "suspended"
            ? `<span class="st-rejected">منتهي / مقفل</span>`
            : dLeft <= 3
            ? `<span class="st-pending">ينتهي خلال ${dLeft} يوم</span>`
            : `<span class="st-completed">نشط (${dLeft} يوم)</span>`;

          const custLink = `${baseUrl}?store=${id}`;
          const admLink = `${baseUrl}?store=${id}&admin=1`;
          const owWp = String(ow.phone || "").replace(/\D/g, "");
          const remindText = encodeURIComponent(`مرحباً ${ow.name || "مدير المتجر"}، نذكّرك بأن اشتراك متجر "${st.info.name}" ينتهي بتاريخ ${sub.expiry_date}. للتجديد يرجى التحويل عبر شام كاش (${ps.shamcash_code}) بقيمة ${ps.monthly_fee_text}.`);

          return `
            <div class="order-card">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <strong>${st.info.name} (${id})</strong>
                ${badge}
              </div>
              <div style="font-size:0.84rem;color:var(--muted);margin-top:4px;">
                المدير: <strong>${ow.name || "-"}</strong> | هاتف: <strong>${ow.phone || "-"}</strong> | المدينة: ${ow.city || "-"}<br/>
                PIN الإدارة: <strong>${sub.admin_pin}</strong> | النوع: ${sub.plan_type === "trial" ? "تجربة مجانية" : "مدفوع"} (${sub.plan_days || 0} يوم) | ينتهي: <strong>${sub.expiry_date || "-"}</strong>
              </div>
              ${ow.notes ? `<div style="font-size:0.82rem;color:#075985;margin-top:4px;">ملاحظات: ${ow.notes}</div>` : ""}

              <div style="display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;">
                <input type="number" id="days_${id}" placeholder="أيام (7 أو 30)" style="width:120px;margin:0;" />
                <select id="ptype_${id}" style="width:135px;margin:0;">
                  <option value="paid">تفعيل اشتراك</option>
                  <option value="trial">تجربة مجانية</option>
                </select>
                <button class="btn btn-ok" onclick="grantSubscription('${id}')">تفعيل المدة</button>
                <button class="btn btn-danger" onclick="toggleSuspendStore('${id}')">${sub.status === "suspended" ? "رفع الإيقاف" : "قفل فوري"}</button>
              </div>

              <div class="row-actions">
                <button class="btn btn-sec" onclick="copyText('${custLink}')">📋 رابط الزبون</button>
                <button class="btn btn-sec" onclick="copyText('${admLink}')">🔑 رابط المدير</button>
                <button class="btn btn-sec" onclick="toggleStoreAds('${id}')">${sub.show_ads ? "🚫 إيقاف الإعلانات" : "📢 تفعيل الإعلانات"}</button>
                ${owWp ? `<a class="btn btn-ok" href="https://wa.me/${owWp}?text=${remindText}" target="_blank">📲 تذكير واتساب</a>` : ""}
                <button class="btn btn-danger" onclick="resetSingleStoreData('${id}')">🧹 تصفير بيانات المحل</button>
              </div>
            </div>
          `;
        }).join("")}
      `;
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => alert("تم نسخ الرابط:\n" + txt));
    }

    async function grantSubscription(id) {
      const st = dbData.stores[id];
      const days = Number(document.getElementById(`days_${id}`).value || 30);
      const ptype = document.getElementById(`ptype_${id}`).value;
      const today = new Date();
      const exp = new Date();
      exp.setDate(today.getDate() + days);

      st.subscription.start_date = today.toISOString().slice(0, 10);
      st.subscription.expiry_date = exp.toISOString().slice(0, 10);
      st.subscription.plan_days = days;
      st.subscription.plan_type = ptype;
      st.subscription.status = "active";

      await saveWithAlert(true);
      renderSuperStoresTab();
    }

    async function toggleSuspendStore(id) {
      const st = dbData.stores[id];
      st.subscription.status = st.subscription.status === "suspended" ? "active" : "suspended";
      await saveWithAlert(true);
      renderSuperStoresTab();
    }

    async function toggleStoreAds(id) {
      const st = dbData.stores[id];
      st.subscription.show_ads = !st.subscription.show_ads;
      await saveWithAlert(true);
      renderSuperStoresTab();
    }

    async function resetSingleStoreData(id) {
      if (!confirm(`هل أنت متأكد من تصفير جميع الطلبات وسجل الزبائن للمتجر (${id})؟`)) return;
      dbData.stores[id].orders = [];
      dbData.stores[id].customers = {};
      await saveWithAlert(true);
      renderSuperStoresTab();
    }

    function renderSuperNewStoreTab() {
      document.getElementById("superTabBody").innerHTML = `
        <h4 class="sec-title">إنشاء متجر جديد في المنصة</h4>
        <label>معرّف المتجر بالإنجليزية (بدون مسافات، مثال: market2):</label>
        <input type="text" id="ns_id" placeholder="مثال: market2" />
        <label>اسم المتجر:</label>
        <input type="text" id="ns_name" placeholder="مثال: سوبر ماركت البركة" />
        <label>نوع النشاط (قالب جاهز):</label>
        <select id="ns_type">
          ${Object.entries(TEMPLATES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}
        </select>
        <label>العملة:</label>
        <input type="text" id="ns_curr" value="ل.س" />
        <label>رمز PIN لصاحب المحل (يفضّل 6 أرقام):</label>
        <input type="text" id="ns_pin" value="${Math.floor(100000 + Math.random() * 900000)}" />

        <h4 class="sec-title">بيانات صاحب المحل (للتواصل والمتابعة)</h4>
        <input type="text" id="ns_ow_name" placeholder="اسم صاحب المحل" />
        <input type="text" id="ns_ow_phone" placeholder="رقم هاتف / واتساب صاحب المحل (مثال: 9639xxxxxxxx)" />
        <input type="text" id="ns_ow_city" placeholder="المدينة / المنطقة" />
        <input type="text" id="ns_ow_notes" placeholder="ملاحظاتك الخاصة" />

        <h4 class="sec-title">فترة التجربة أو الاشتراك الأولية</h4>
        <select id="ns_plan_type">
          <option value="trial">تجربة مجانية</option>
          <option value="paid">اشتراك مدفوع</option>
        </select>
        <input type="number" id="ns_days" value="7" placeholder="عدد الأيام (مثال: 7 أو 30)" />
        <label><input type="checkbox" id="ns_ads" checked style="width:auto;" /> عرض إعلانات المنصة داخل هذا المتجر</label>

        <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="createNewStore()">إنشاء المتجر وتفعيله الآن</button>
      `;
    }

    async function createNewStore() {
      const id = document.getElementById("ns_id").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
      const name = document.getElementById("ns_name").value.trim();
      const type = document.getElementById("ns_type").value;
      const currency = document.getElementById("ns_curr").value.trim() || "ل.س";
      const pin = document.getElementById("ns_pin").value.trim() || "482910";
      const days = Number(document.getElementById("ns_days").value || 7);
      const planType = document.getElementById("ns_plan_type").value;

      if (!id || !name) { alert("أدخل معرّف المتجر واسمه."); return; }
      if (dbData.stores[id]) { alert("هذا المعرّف مستخدم مسبقاً، اختر معرّفاً آخر."); return; }

      const tpl = TEMPLATES[type] || TEMPLATES.custom;
      const today = new Date();
      const exp = new Date();
      exp.setDate(today.getDate() + days);

      dbData.stores[id] = {
        info: {
          name, type, theme_color: "#d97706", currency, is_open: true,
          phone_whatsapp: document.getElementById("ns_ow_phone").value.trim(),
          location_text: document.getElementById("ns_ow_city").value.trim(),
          delivery_type: "fixed", delivery_fee: 5000,
          shamcash: { account_code: "", account_name: "" }
        },
        owner: {
          name: document.getElementById("ns_ow_name").value.trim(),
          phone: document.getElementById("ns_ow_phone").value.trim(),
          city: document.getElementById("ns_ow_city").value.trim(),
          notes: document.getElementById("ns_ow_notes").value.trim()
        },
        subscription: {
          admin_pin: pin,
          plan_type: planType,
          plan_days: days,
          start_date: today.toISOString().slice(0, 10),
          expiry_date: exp.toISOString().slice(0, 10),
          grace_days: 3,
          status: "active",
          show_ads: document.getElementById("ns_ads").checked
        },
        categories: [...tpl.categories],
        items: JSON.parse(JSON.stringify(tpl.sampleItems)),
        offers: [],
        promos: { loyalty: { enabled: false, every_n_orders: 3, discount_percent: 10 }, coupons: [] },
        customers: {},
        orders: []
      };

      await saveWithAlert(true);
      activeSuperTab = "stores";
      renderSuperAdminWorkspace();
    }

    function renderSuperAdsTab() {
      const ads = dbData.platform_settings.ads || [];
      document.getElementById("superTabBody").innerHTML = `
        <h4 class="sec-title">إضافة إعلان مركزي جديد (يظهر في كل المتاجر)</h4>
        <input type="text" id="ad_title" placeholder="عنوان الإعلان" />
        <input type="text" id="ad_desc" placeholder="نص الإعلان القصير" />
        <input type="text" id="ad_img" placeholder="رابط صورة الإعلان (اختياري)" />
        <input type="text" id="ad_link" placeholder="رابط عند الضغط (واتساب أو موقع المعلن)" />
        <button class="btn btn-dark" onclick="addGlobalAd()">+ نشر الإعلان في كل المتاجر</button>

        <h4 class="sec-title">الإعلانات الحالية</h4>
        ${ads.length === 0 ? `<p style="color:var(--muted)">لا توجد إعلانات مضافة بعد.</p>` : ads.map((a, i) => `
          <div class="order-card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <strong>${a.title}</strong>
              <span>النقرات: <strong>${a.clicks || 0}</strong></span>
            </div>
            <div style="font-size:0.84rem;color:var(--muted);margin:4px 0;">${a.desc || ""}</div>
            <div class="row-actions">
              <button class="btn btn-sec" onclick="toggleGlobalAd(${i})">${a.active ? "إيقاف مؤقت" : "تفعيل"}</button>
              <button class="btn btn-danger" onclick="deleteGlobalAd(${i})">حذف</button>
            </div>
          </div>
        `).join("")}
      `;
    }

    async function addGlobalAd() {
      const title = document.getElementById("ad_title").value.trim();
      const desc = document.getElementById("ad_desc").value.trim();
      const image = document.getElementById("ad_img").value.trim();
      const link = document.getElementById("ad_link").value.trim();
      if (!title) { alert("أدخل عنوان الإعلان."); return; }
      dbData.platform_settings.ads.push({ id: "ad_" + Date.now(), title, desc, image, link, active: true, clicks: 0 });
      await saveWithAlert(true);
      renderSuperAdsTab();
    }

    async function toggleGlobalAd(i) {
      dbData.platform_settings.ads[i].active = !dbData.platform_settings.ads[i].active;
      await saveWithAlert(true);
      renderSuperAdsTab();
    }

    async function deleteGlobalAd(i) {
      dbData.platform_settings.ads.splice(i, 1);
      await saveWithAlert(true);
      renderSuperAdsTab();
    }

    function renderSuperPlatformTab() {
      const ps = dbData.platform_settings;
      document.getElementById("superTabBody").innerHTML = `
        <h4 class="sec-title">معلوماتك كمنشئ للمنصة (تتحدث تلقائياً في جميع المواقع)</h4>
        <label>اسم المنصة:</label>
        <input type="text" id="ps_pname" value="${ps.platform_name || ""}" />
        <label>اسمك / اسم المطور:</label>
        <input type="text" id="ps_cname" value="${ps.creator_name || ""}" />
        <label>رقم واتسابك (بصيغة دولية مثل 9639xxxxxxxx):</label>
        <input type="text" id="ps_cwp" value="${ps.creator_whatsapp || ""}" />
        <label>رابط صفحتك أو موقعك (اختياري):</label>
        <input type="text" id="ps_clink" value="${ps.creator_link || ""}" />
        <label>العبارة التسويقية في أسفل كل متجر:</label>
        <input type="text" id="ps_tag" value="${ps.promo_tagline || ""}" />

        <h4 class="sec-title">بيانات الدفع والاشتراك الخاصة بك (شام كاش)</h4>
        <label>حساب / معرّف شام كاش الخاص بك:</label>
        <input type="text" id="ps_sc_code" value="${ps.shamcash_code || ""}" />
        <label>اسم المستفيد في شام كاش:</label>
        <input type="text" id="ps_sc_name" value="${ps.shamcash_name || ""}" />
        <label>قيمة الاشتراك الشهري المعروضة للمدراء:</label>
        <input type="text" id="ps_fee" value="${ps.monthly_fee_text || ""}" />
        <label>مهلة السماح بعد انتهاء الاشتراك (بالأيام):</label>
        <input type="number" id="ps_grace" value="${ps.default_grace_days ?? 3}" />

        <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="saveSuperPlatformSettings()">حفظ ونشر على جميع المواقع فوراً</button>
      `;
    }

    async function saveSuperPlatformSettings() {
      const ps = dbData.platform_settings;
      ps.platform_name = document.getElementById("ps_pname").value.trim();
      ps.creator_name = document.getElementById("ps_cname").value.trim();
      ps.creator_whatsapp = document.getElementById("ps_cwp").value.trim();
      ps.creator_link = document.getElementById("ps_clink").value.trim();
      ps.promo_tagline = document.getElementById("ps_tag").value.trim();
      ps.shamcash_code = document.getElementById("ps_sc_code").value.trim();
      ps.shamcash_name = document.getElementById("ps_sc_name").value.trim();
      ps.monthly_fee_text = document.getElementById("ps_fee").value.trim();
      ps.default_grace_days = Number(document.getElementById("ps_grace").value || 3);
      await saveWithAlert(false);
    }

    function renderSuperMaintenanceTab() {
      document.getElementById("superTabBody").innerHTML = `
        <h4 class="sec-title">النسخ الاحتياطي وتصفير قواعد البيانات</h4>
        <p style="font-size:0.86rem;color:var(--muted);">يمكنك تحميل نسخة احتياطية كاملة لكل المتاجر والإعدادات، أو تصفير سجلات الطلبات والزبائن على مستوى المنصة بالكامل.</p>
        <div class="row-actions">
          <button class="btn btn-dark" onclick="exportFullBackup()">📥 تحميل نسخة احتياطية (JSON)</button>
          <button class="btn btn-danger" onclick="resetAllPlatformOrders()">🗑️ تصفير طلبات جميع المتاجر</button>
          <button class="btn btn-danger" onclick="resetAllPlatformCustomers()">🗑️ تصفير زبائن جميع المتاجر</button>
        </div>
      `;
    }

    function exportFullBackup() {
      const blob = new Blob([JSON.stringify(dbData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `smart_stores_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    async function resetAllPlatformOrders() {
      if (!confirm("تحذير: سيتم تصفير سجل الطلبات لجميع المتاجر في المنصة! هل أنت متأكد؟")) return;
      Object.values(dbData.stores || {}).forEach(st => { st.orders = []; });
      await saveWithAlert(true);
      alert("تم تصفير طلبات جميع المتاجر بنجاح.");
    }

    async function resetAllPlatformCustomers() {
      if (!confirm("تحذير: سيتم تصفير سجل الزبائن لجميع المتاجر في المنصة! هل أنت متأكد؟")) return;
      Object.values(dbData.stores || {}).forEach(st => { st.customers = {}; });
      await saveWithAlert(true);
      alert("تم تصفير سجلات الزبائن لجميع المتاجر بنجاح.");
    }

    async function saveWithAlert(silent) {
      const ok = await DB_ADAPTER.save(dbData);
      if (ok) {
        if (!silent) alert("تم الحفظ والتحديث بنجاح!");
      } else {
        alert("تعذر الحفظ. تأكد من صلاحية التوكن.");
      }
    }

    init();
  </script>
</body>
</html>
