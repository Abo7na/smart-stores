<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المتاجر الذكية</title>
  <style>
    :root { --primary: #d97706; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 130px; }
    header { background: var(--primary); color: #fff; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 25; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    header h1 { margin: 0; font-size: 1.1rem; }
    .sub-tag { font-size: 0.78rem; opacity: 0.92; display: block; margin-top: 2px; }
    .btn { border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
    .btn-light { background: rgba(255,255,255,.22); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-dark { background: #1e293b; color: #fff; }
    .btn-ok { background: #15803d; color: #fff; padding: 6px 10px; font-size: 0.82rem; }
    .btn-danger { background: #dc2626; color: #fff; padding: 6px 10px; font-size: 0.82rem; }
    .btn-sec { background: #e2e8f0; color: #0f172a; padding: 6px 10px; font-size: 0.82rem; }
    .container { max-width: 760px; margin: 14px auto; padding: 0 14px; }
    .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; font-weight: 600; font-size: 0.9rem; }
    .alert-warn { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    .alert-err { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    .store-meta { background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.86rem; color: var(--muted); border: 1px solid #e2e8f0; }
    .offers-box { margin-bottom: 12px; }
    .offer-card { background: linear-gradient(135deg, #fffbeb, #ffffff); border: 1px dashed var(--primary); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
    .offer-title { font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .search-box { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 12px; font-size: 0.95rem; background: #fff; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
    .cat-btn { background: var(--card); border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 14px; white-space: nowrap; cursor: pointer; font-size: 0.88rem; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .item-card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .item-img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid #e2e8f0; flex-shrink: 0; }
    .item-title { font-weight: 700; margin-bottom: 4px; }
    .item-desc { color: var(--muted); font-size: 0.84rem; margin-bottom: 6px; }
    .item-price { font-weight: 700; color: var(--primary); }
    .qty-box { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-weight: bold; cursor: pointer; }
    .panel { background: var(--card); border-radius: 12px; padding: 16px; margin-top: 14px; border: 1px solid #e2e8f0; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 6px; margin-bottom: 10px; background: #fff; font-size: 0.9rem; }
    input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }
    .badge-off { background: #fee2e2; color: #b91c1c; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; }
    .checkout-box { background: var(--card); border-radius: 12px; padding: 14px; margin-top: 14px; border: 1px solid #cbd5e1; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 30; box-shadow: 0 -4px 12px rgba(0,0,0,.08); }
    .admin-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { background: #f1f5f9; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
    .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .order-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .st-pending { background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .st-completed { background: #dcfce7; color: #166534; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .st-rejected { background: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .sec-title { margin: 16px 0 8px; font-size: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="storeName">جاري التحميل...</h1>
      <span class="sub-tag" id="storeTypeTag"></span>
    </div>
    <button id="adminHeaderBtn" class="btn btn-light" style="display:none;" onclick="toggleAdmin()">إدارة المحل</button>
  </header>

  <div class="container">
    <div id="subBanner"></div>
    <div id="closedBanner"></div>

    <div id="storeContent">
      <div id="storeMeta" class="store-meta" style="display:none;"></div>
      <div id="offersBox" class="offers-box" style="display:none;"></div>
      <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن صنف أو منتج..." oninput="renderMenu()" style="display:none;" />
      <div class="cats" id="catsBar"></div>
      <div id="itemsList"></div>

      <div id="checkoutBox" class="checkout-box" style="display:none;">
        <h3 style="margin-top:0;">بيانات الطلب والدفع</h3>
        <label>رقم الهاتف (يُحفظ تلقائياً ويفعّل خصم الطلبات المتكررة):</label>
        <input type="tel" id="custPhone" placeholder="مثال: 09xxxxxxxx" oninput="checkCustomerLoyalty()" />
        <div id="loyaltyMsg" style="font-size:0.85rem;color:#15803d;font-weight:700;margin-bottom:8px;"></div>

        <label>الاسم الكامل:</label>
        <input type="text" id="custName" placeholder="اكتب اسمك" />

        <div id="deliveryFields">
          <label>العنوان التفصيلي:</label>
          <input type="text" id="custAddress" placeholder="الحي، الشارع، البناء..." />
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
            <button type="button" class="btn btn-sec" onclick="shareGPS()">📍 مشاركة موقعي الحالي (GPS)</button>
            <span id="gpsStatus" style="font-size:0.8rem;color:var(--muted);"></span>
          </div>
          <input type="hidden" id="custGPS" />
        </div>

        <div id="barberFields" style="display:none;">
          <label>تاريخ الموعد:</label>
          <input type="date" id="bookDate" />
          <label>الوقت المفضل:</label>
          <input type="time" id="bookTime" />
        </div>

        <label>كوبون خصم (إن وجد):</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="couponCode" placeholder="أدخل كود الخصم" style="margin:0;" />
          <button type="button" class="btn btn-dark" onclick="applyCoupon()">تطبيق</button>
        </div>
        <div id="couponMsg" style="font-size:0.84rem;margin:6px 0 10px;font-weight:600;"></div>

        <label>طريقة الدفع:</label>
        <select id="payMethod" onchange="toggleShamCashBox()">
          <option value="manual">دفع يدوي / عند الاستلام</option>
          <option value="shamcash">عبر شام كاش (ShamCash)</option>
        </select>

        <div id="shamCashBox" style="display:none;background:#f8fafc;border:1px solid #cbd5e1;border-radius:10px;padding:10px;margin-bottom:10px;">
          <div id="shamCashInfo" style="font-size:0.86rem;font-weight:700;margin-bottom:6px;"></div>
          <label>رقم عملية / مرجع تحويل شام كاش:</label>
          <input type="text" id="shamCashRef" placeholder="أدخل رقم العملية بعد التحويل" />
        </div>
      </div>
    </div>

    <div id="adminPanel" class="panel" style="display:none;">
      <h3 style="margin-top:0;">لوحة إدارة المحل</h3>
      <div id="adminLogin">
        <label>رمز PIN الخاص بالمحل:</label>
        <input type="password" id="pinInput" placeholder="أدخل رمز PIN" />
        <button class="btn btn-primary" style="width:100%;" onclick="unlockAdmin()">دخول</button>
      </div>
      <div id="adminWorkspace" style="display:none;"></div>
    </div>
  </div>

  <div class="cart-bar" id="cartBar" style="display:none;">
    <div>
      <div>الإجمالي: <strong id="cartTotal">0</strong> <span id="currLabel"></span></div>
      <small id="cartSummarySub" style="color:var(--muted)"></small>
    </div>
    <button class="btn btn-primary" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
  </div>

  <script>
    const GIST_ID = "29a880a7f2a8e52e7ca8192168eae9e9";
    const API_URL = `https://api.github.com/gists/${GIST_ID}`;
    const params = new URLSearchParams(location.search);
    const storeId = params.get("store") || "bakery1";
    const isAdminRoute = params.get("admin") === "1";

    (function captureSecretKeyFromHash() {
      if (location.hash && location.hash.startsWith("#key=")) {
        const rawKey = decodeURIComponent(location.hash.slice(5)).trim();
        if (rawKey) localStorage.setItem("smart_store_sync_key", rawKey);
        history.replaceState(null, "", location.pathname + location.search);
      }
    })();

    const TYPE_LABELS = {
      bakery: "معجنات ومخبوزات",
      market: "سوبر ماركت ومواد غذائية",
      barber: "صالون حلاقة وحجز مواعيد",
      tobacco: "مركز تبغ ومعسل"
    };

    let dbData = null;
    let store = null;
    let activeCat = "الكل";
    let cart = {};
    let isSuspended = false;
    let appliedCoupon = null;
    let loyaltyDiscountPct = 0;
    let activeAdminTab = "orders";
    let ordersFilter = "all";

    async function init() {
      if (isAdminRoute) {
        document.getElementById("adminHeaderBtn").style.display = "inline-block";
        document.getElementById("adminPanel").style.display = "block";
      }
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const gist = await res.json();
        const fileObj = gist.files["stores.json"] || Object.values(gist.files)[0];
        if (!fileObj || !fileObj.content) throw new Error("ملف stores.json فارغ أو غير موجود");
        dbData = JSON.parse(fileObj.content);
        store = dbData.stores[storeId];
        if (!store) {
          document.getElementById("storeName").textContent = "المتجر غير موجود";
          document.getElementById("storeContent").innerHTML = `<div class="alert alert-err">لم يتم العثور على المتجر: ${storeId}</div>`;
          return;
        }
        ensureStoreStructure();
        applyTheme();
        renderMeta();
        renderOffers();
        checkSubscription();
        checkOpenStatus();
        loadSavedCustomerLocal();
        renderMenu();
      } catch (e) {
        document.getElementById("storeName").textContent = "تعذر التحميل";
        document.getElementById("storeContent").innerHTML = `<div class="alert alert-err">سبب المشكلة: ${e.message}</div>`;
      }
    }

    function ensureStoreStructure() {
      store.info = store.info || {};
      store.items = store.items || [];
      store.offers = store.offers || [];
      store.categories = store.categories || ["عام"];
      store.customers = store.customers || {};
      store.orders = store.orders || [];
      store.promos = store.promos || {
        loyalty: { enabled: false, every_n_orders: 3, discount_percent: 10 },
        coupons: []
      };
      store.promos.loyalty = store.promos.loyalty || { enabled: false, every_n_orders: 3, discount_percent: 10 };
      store.promos.coupons = store.promos.coupons || [];
    }

    function applyTheme() {
      const t = store.info.type || "bakery";
      document.title = store.info.name;
      document.getElementById("storeName").textContent = store.info.name;
      document.getElementById("storeTypeTag").textContent = TYPE_LABELS[t] || "";
      document.documentElement.style.setProperty("--primary", store.info.theme_color || "#d97706");
      document.getElementById("currLabel").textContent = store.info.currency || "";

      if (t === "market" || t === "tobacco") document.getElementById("searchInput").style.display = "block";
      if (t === "barber") {
        document.getElementById("deliveryFields").style.display = "none";
        document.getElementById("barberFields").style.display = "block";
        const bd = document.getElementById("bookDate");
        if (bd && !bd.value) bd.valueAsDate = new Date();
      }

      const sc = store.info.shamcash || {};
      document.getElementById("shamCashInfo").textContent =
        `حساب شام كاش: ${sc.account_code || "غير محدد"} | الاسم: ${sc.account_name || ""}`;
    }

    function renderMeta() {
      const metaEl = document.getElementById("storeMeta");
      const loc = store.info.location_text || "";
      const phone = store.info.phone_whatsapp || "";
      const delType = store.info.delivery_type || "fixed";
      const fee = Number(store.info.delivery_fee || 0);
      let parts = [];
      if (loc) parts.push(`📍 ${loc}`);
      if (phone) parts.push(`📞 ${phone}`);
      if ((store.info.type || "bakery") !== "barber") {
        parts.push(delType === "free" ? "🚚 توصيل مجاني" : `🚚 توصيل: ${fee.toLocaleString()} ${store.info.currency || ""}`);
      }
      if (parts.length > 0) {
        metaEl.style.display = "block";
        metaEl.innerHTML = parts.join(" &nbsp;|&nbsp; ");
      }
    }

    function renderOffers() {
      const box = document.getElementById("offersBox");
      if (!store.offers.length) { box.style.display = "none"; return; }
      box.style.display = "block";
      box.innerHTML = store.offers.map(o => `
        <div class="offer-card">
          <div class="offer-title">🔥 عرض: ${o.title}</div>
          <div style="font-size:0.86rem;">${o.desc || ""}</div>
          ${o.price ? `<div style="font-weight:700;margin-top:4px;">سعر العرض: ${Number(o.price).toLocaleString()} ${store.info.currency || ""}</div>` : ""}
        </div>
      `).join("");
    }

    function checkSubscription() {
      const sub = store.subscription || {};
      const warnDays = (dbData.platform_settings && dbData.platform_settings.warning_days) || 3;
      const graceDays = sub.grace_days ?? ((dbData.platform_settings && dbData.platform_settings.default_grace_days) || 3);
      if (!sub.expiry_date) return;

      const today = new Date();
      today.setHours(0,0,0,0);
      const exp = new Date(sub.expiry_date + "T00:00:00");
      const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
      const banner = document.getElementById("subBanner");

      if (diffDays < -graceDays || sub.status === "suspended") {
        isSuspended = true;
        banner.innerHTML = `<div class="alert alert-err">تم إيقاف صفحة المتجر مؤقتاً لانتهاء فترة الاشتراك والسماح.</div>`;
        document.getElementById("storeContent").style.display = "none";
        document.getElementById("cartBar").style.display = "none";
      } else if (diffDays <= 0) {
        banner.innerHTML = `<div class="alert alert-warn">انتهى تاريخ الاشتراك! لديك مهلة سماح (${graceDays} أيام) قبل الإيقاف التلقائي.</div>`;
      } else if (diffDays <= warnDays) {
        banner.innerHTML = `<div class="alert alert-warn">تنبيه: ينتهي اشتراك المتجر خلال ${diffDays} يوم (${sub.expiry_date}).</div>`;
      }
    }

    function checkOpenStatus() {
      if (isSuspended) return;
      const cb = document.getElementById("closedBanner");
      cb.innerHTML = store.info.is_open === false
        ? `<div class="alert alert-warn">المتجر مغلق مؤقتاً لاستقبال الطلبات حالياً.</div>`
        : "";
    }

    function loadSavedCustomerLocal() {
      const saved = JSON.parse(localStorage.getItem("smart_store_customer_" + storeId) || "null");
      if (!saved) return;
      if (saved.phone) document.getElementById("custPhone").value = saved.phone;
      if (saved.name) document.getElementById("custName").value = saved.name;
      if (saved.address) document.getElementById("custAddress").value = saved.address;
      if (saved.gps) {
        document.getElementById("custGPS").value = saved.gps;
        document.getElementById("gpsStatus").textContent = "تم حفظ الموقع مسبقاً ✓";
      }
      checkCustomerLoyalty();
    }

    function checkCustomerLoyalty() {
      const phone = document.getElementById("custPhone").value.trim();
      const msgEl = document.getElementById("loyaltyMsg");
      loyaltyDiscountPct = 0;
      const loy = store.promos.loyalty || {};
      if (!phone || !loy.enabled || !loy.every_n_orders) {
        msgEl.textContent = "";
        updateTotals();
        return;
      }
      const cust = store.customers[phone];
      const completedCount = cust ? Number(cust.completed_orders || 0) : 0;
      const nextOrderNum = completedCount + 1;
      if (nextOrderNum % Number(loy.every_n_orders) === 0) {
        loyaltyDiscountPct = Number(loy.discount_percent || 0);
        msgEl.textContent = `🎉 زبون مميز! هذا طلبك رقم (${nextOrderNum}) ويستحق خصم ولاء ${loyaltyDiscountPct}% تلقائياً.`;
      } else {
        const rem = Number(loy.every_n_orders) - (nextOrderNum % Number(loy.every_n_orders));
        msgEl.textContent = `طلباتك المنفذة: ${completedCount} (يتبقى ${rem} طلب لخصم ${loy.discount_percent}%).`;
      }
      updateTotals();
    }

    function shareGPS() {
      const st = document.getElementById("gpsStatus");
      if (!navigator.geolocation) { st.textContent = "المتصفح لا يدعم GPS"; return; }
      st.textContent = "جاري تحديد الموقع...";
      navigator.geolocation.getCurrentPosition(pos => {
        const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        document.getElementById("custGPS").value = link;
        st.textContent = "تم تحديد الموقع ✓";
      }, () => {
        st.textContent = "تعذر الوصول للموقع";
      });
    }

    function applyCoupon() {
      const code = document.getElementById("couponCode").value.trim().toUpperCase();
      const msg = document.getElementById("couponMsg");
      appliedCoupon = null;
      if (!code) { msg.textContent = ""; updateTotals(); return; }
      const found = (store.promos.coupons || []).find(c => c.active && String(c.code || "").toUpperCase() === code);
      if (!found) {
        msg.style.color = "#b91c1c";
        msg.textContent = "كوبون غير صالح أو غير مفعّل.";
      } else {
        appliedCoupon = found;
        msg.style.color = "#15803d";
        msg.textContent = `تم تفعيل الكوبون (${found.code}) بخصم ${found.type === "percent" ? found.value + "%" : Number(found.value).toLocaleString() + " " + (store.info.currency || "")}.`;
      }
      updateTotals();
    }

    function toggleShamCashBox() {
      const m = document.getElementById("payMethod").value;
      document.getElementById("shamCashBox").style.display = m === "shamcash" ? "block" : "none";
    }

    function renderMenu() {
      if (isSuspended) return;
      const cats = ["الكل", ...store.categories];
      document.getElementById("catsBar").innerHTML = cats.map(c =>
        `<button class="cat-btn ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`
      ).join("");

      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const filtered = store.items.filter(i => {
        const mc = activeCat === "الكل" || i.category === activeCat;
        const ms = !q || i.name.toLowerCase().includes(q) || (i.desc || "").toLowerCase().includes(q);
        return mc && ms;
      });

      document.getElementById("itemsList").innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        const imgTag = item.image ? `<img src="${item.image}" alt="${item.name}" class="item-img" onerror="this.style.display='none'" />` : "";
        return `
          <div class="item-card">
            <div class="item-left">
              ${imgTag}
              <div>
                <div class="item-title">${item.name} ${!item.available ? '<span class="badge-off">نفد</span>' : ''}</div>
                <div class="item-desc">${item.desc || ""}</div>
                <div class="item-price">${Number(item.price).toLocaleString()} ${store.info.currency || ""}</div>
              </div>
            </div>
            <div class="qty-box">
              ${item.available ? `
                <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                <span>${qty}</span>
                <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
              ` : `<small style="color:var(--muted)">غير متوفر</small>`}
            </div>
          </div>
        `;
      }).join("");
      updateTotals();
    }

    function setCat(c) { activeCat = c; renderMenu(); }

    function changeQty(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) delete cart[id];
      else cart[id] = next;
      renderMenu();
    }

    function calculateTotals() {
      let count = 0, subtotal = 0;
      const lines = [];
      for (const [id, qty] of Object.entries(cart)) {
        const it = store.items.find(x => x.id === id);
        if (it) {
          count += qty;
          const lineSum = Number(it.price) * qty;
          subtotal += lineSum;
          lines.push({ id: it.id, name: it.name, qty, price: Number(it.price), total: lineSum });
        }
      }
      let discount = 0;
      if (loyaltyDiscountPct > 0) discount += Math.round((subtotal * loyaltyDiscountPct) / 100);
      if (appliedCoupon) {
        if (appliedCoupon.type === "percent") discount += Math.round((subtotal * Number(appliedCoupon.value || 0)) / 100);
        else discount += Number(appliedCoupon.value || 0);
      }
      if (discount > subtotal) discount = subtotal;

      const isBarber = (store.info.type || "bakery") === "barber";
      const deliveryFee = isBarber ? 0 : (store.info.delivery_type === "free" ? 0 : Number(store.info.delivery_fee || 0));
      const finalTotal = Math.max(0, subtotal - discount + deliveryFee);
      return { count, subtotal, discount, deliveryFee, finalTotal, lines };
    }

    function updateTotals() {
      if (isSuspended) return;
      const t = calculateTotals();
      const bar = document.getElementById("cartBar");
      const checkout = document.getElementById("checkoutBox");
      if (t.count === 0) {
        bar.style.display = "none";
        checkout.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      checkout.style.display = "block";
      document.getElementById("cartTotal").textContent = t.finalTotal.toLocaleString();
      document.getElementById("cartSummarySub").textContent =
        `${t.count} أصناف | خصم: ${t.discount.toLocaleString()} | توصيل: ${t.deliveryFee.toLocaleString()}`;
    }

    function submitOrder() {
      if (store.info.is_open === false) { alert("المتجر مغلق مؤقتاً لاستقبال الطلبات."); return; }
      const phone = document.getElementById("custPhone").value.trim();
      const name = document.getElementById("custName").value.trim();
      const address = document.getElementById("custAddress").value.trim();
      const gps = document.getElementById("custGPS").value.trim();
      const payMethod = document.getElementById("payMethod").value;
      const shamRef = document.getElementById("shamCashRef").value.trim();
      const isBarber = (store.info.type || "bakery") === "barber";
      const bookDate = document.getElementById("bookDate").value;
      const bookTime = document.getElementById("bookTime").value;

      if (!phone || !name) { alert("يرجى إدخال رقم الهاتف والاسم."); return; }
      if (!isBarber && !address && !gps) { alert("يرجى إدخال العنوان أو مشاركة الموقع GPS."); return; }
      if (isBarber && (!bookDate || !bookTime)) { alert("يرجى اختيار تاريخ ووقت الموعد."); return; }
      if (payMethod === "shamcash" && !shamRef) { alert("يرجى إدخال رقم عملية تحويل شام كاش."); return; }

      localStorage.setItem("smart_store_customer_" + storeId, JSON.stringify({ phone, name, address, gps }));

      const t = calculateTotals();
      const curr = store.info.currency || "";
      let msg = [
        `طلب جديد من *${store.info.name}*`,
        `الزبون: ${name} (${phone})`,
        isBarber ? `موعد الحجز: ${bookDate} - ${bookTime}` : `العنوان: ${address || "-"}`,
        gps ? `الموقع GPS: ${gps}` : "",
        `طريقة الدفع: ${payMethod === "shamcash" ? "شام كاش (مرجع: " + shamRef + ")" : "يدوي / عند الاستلام"}`,
        `--- الأصناف ---`,
        ...t.lines.map(l => `• ${l.name} × ${l.qty} = ${l.total.toLocaleString()} ${curr}`),
        t.discount > 0 ? `الخصم: -${t.discount.toLocaleString()} ${curr}` : "",
        !isBarber ? `التوصيل: ${t.deliveryFee.toLocaleString()} ${curr}` : "",
        `*الإجمالي: ${t.finalTotal.toLocaleString()} ${curr}*`
      ].filter(Boolean).join("\n");

      const wp = (store.info.phone_whatsapp || "").replace(/\D/g, "");
      if (wp) window.open(`https://wa.me/${wp}?text=${encodeURIComponent(msg)}`, "_blank");
      else alert("تم تجهيز الطلب.");
    }

    async function addOrderRecord() {
      const phone = document.getElementById("new_ord_phone").value.trim();
      const name = document.getElementById("new_ord_name").value.trim();
      const summary = document.getElementById("new_ord_summary").value.trim();
      const total = Number(document.getElementById("new_ord_total").value || 0);
      const pay_method = document.getElementById("new_ord_pay").value;
      const sham_ref = document.getElementById("new_ord_ref").value.trim();
      if (!phone || !summary) { alert("يرجى إدخال رقم الزبون وملخص الطلب."); return; }

      store.orders.unshift({
        id: "ORD" + String(Date.now()).slice(-5),
        customer_phone: phone,
        customer_name: name || "زبون",
        summary,
        total,
        pay_method,
        sham_ref,
        status: "pending"
      });
      upsertCustomer(phone, name, 0, 0);
      await saveAllDirect(true);
      renderOrdersTab();
    }

    function upsertCustomer(phone, name, addCompletedCount, addSpent) {
      if (!phone) return;
      store.customers[phone] = store.customers[phone] || {
        name: name || "",
        phone,
        completed_orders: 0,
        total_spent: 0,
        last_order_at: ""
      };
      if (name) store.customers[phone].name = name;
      store.customers[phone].completed_orders = Number(store.customers[phone].completed_orders || 0) + Number(addCompletedCount || 0);
      store.customers[phone].total_spent = Number(store.customers[phone].total_spent || 0) + Number(addSpent || 0);
      store.customers[phone].last_order_at = new Date().toISOString().slice(0, 10);
    }

    async function approveOrder(orderId) {
      const ord = store.orders.find(x => x.id === orderId);
      if (!ord) return;
      const eta = document.getElementById(`eta_${orderId}`).value.trim() || "في أقرب وقت";
      ord.delivery_eta = eta;
      ord.status = "completed";
      upsertCustomer(ord.customer_phone, ord.customer_name, 1, ord.total);
      await saveAllDirect(true);

      const curr = store.info.currency || "";
      const invoiceText = [
        `🧾 *فاتورة معتمدة من ${store.info.name}*`,
        `رقم الطلب: #${ord.id}`,
        `الزبون: ${ord.customer_name || ""}`,
        `التفاصيل: ${ord.summary}`,
        `الإجمالي: *${Number(ord.total || 0).toLocaleString()} ${curr}*`,
        `موعد التسليم المتوقع: *${eta}*`
      ].join("\n");
      const cPhone = String(ord.customer_phone || "").replace(/\D/g, "");
      if (cPhone) window.open(`https://wa.me/${cPhone}?text=${encodeURIComponent(invoiceText)}`, "_blank");
      renderOrdersTab();
    }

    async function rejectOrder(orderId) {
      const ord = store.orders.find(x => x.id === orderId);
      if (!ord) return;
      const reason = document.getElementById(`rej_${orderId}`).value.trim() || "تعذر تنفيذ الطلب حالياً";
      ord.reject_reason = reason;
      ord.status = "rejected";
      await saveAllDirect(true);

      const apologyText = [
        `نعتذر منك *${ord.customer_name || "عزيزنا الزبون"}* بخصوص الطلب *#${ord.id}* من *${store.info.name}*.`,
        `سبب الاعتذار: ${reason}`
      ].join("\n");
      const cPhone = String(ord.customer_phone || "").replace(/\D/g, "");
      if (cPhone) window.open(`https://wa.me/${cPhone}?text=${encodeURIComponent(apologyText)}`, "_blank");
      renderOrdersTab();
    }

    }

    function renderCustomersTab() {
      const custList = Object.values(store.customers || {});
      const curr = store.info.currency || "";
      document.getElementById("adminTabBody").innerHTML = `
        <h4 class="sec-title">سجل الزبائن (${custList.length})</h4>
        ${custList.length === 0 ? `<p style="color:var(--muted)">لا يوجد زبائن مسجلون بعد.</p>` : custList.map(c => `
          <div class="order-card">
            <strong>${c.name || "زبون"}</strong> — <span>${c.phone}</span><br/>
            <small style="color:var(--muted)">
              طلبات منفذة: <strong>${c.completed_orders || 0}</strong> |
              إجمالي المشتريات: <strong>${Number(c.total_spent || 0).toLocaleString()} ${curr}</strong> |
              آخر طلب: ${c.last_order_at || "-"}
            </small>
          </div>
        `).join("")}
      `;
    }

    async function saveAllDirect(silent) {
      const syncKey = localStorage.getItem("smart_store_sync_key");
      if (!syncKey) {
        alert("هذا الجهاز غير مفعّل للحفظ التلقائي. افتح رابط التفعيل الخاص بالإدارة مرة واحدة.");
        return;
      }
      const res = await fetch(API_URL, {
        method: "PATCH",
        headers: { "Authorization": `Bearer ${syncKey}`, "Content-Type": "application/json" },
        body: JSON.stringify({ files: { "stores.json": { content: JSON.stringify(dbData, null, 2) } } })
      });
      if (res.ok) {
        if (!silent) {
          alert("تم حفظ التعديلات ونشرها تلقائياً!");
          location.reload();
        }
      } else {
        alert("تعذر الحفظ التلقائي. تأكد من صلاحية Gists في مفتاح التفعيل.");
      }
    }

    init();
  </script>
</body>
</html>
